name: Qualidade

on:
  push:
    branches: [main, feat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Análise estática
        run: python -m ruff check .
      - name: Testes sem coleta de rede
        run: python -m pytest
      - name: Conciliação com referência oficial congelada
        run: python scripts/validar_referencia.py

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar runtime e captura visual
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Executar Streamlit e capturar telas reais
        run: |
          python -m streamlit run code/04_visualizacao.py --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          node scripts/capturar_dashboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-capturas
          path: docs/images/
          if-no-files-found: warn
